---
- name: Configure Cloudflared Repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    uris: https://pkg.cloudflare.com/cloudflared
    types: deb
    suites: any
    components: main
    signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg

- name: Install required software
  ansible.builtin.apt:
    name:
      - podman
      - passt # network namespace support for podman
      - cloudflared
      - sqlite3 # for backups
    state: present
    update_cache: true

- name: Create pocket-id system group
  ansible.builtin.group:
    name: pocket-id
    system: true
  register: pocket_id_group

- name: Create pocket-id system user
  ansible.builtin.user:
    name: pocket-id
    group: pocket-id
    system: true
    home: /var/lib/pocket-id
    create_home: true
    shell: /usr/sbin/nologin
  register: pocket_id_user

# Rootless podman needs subordinate UID/GID ranges to remap container users;
# `useradd --system` does not allocate these automatically like a normal
# `useradd` would.
- name: Allow subordinate UIDs/GIDs for rootless podman
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "pocket-id:{{ pocket_id_subid_start }}:{{ pocket_id_subid_count }}"
    search_string: "pocket-id:"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

# Scoped narrowly to pocket-id (not a general runas-ALL grant) so Ansible can
# manage pocket-id's own systemd --user instance via become_user.
- name: Allow admin to run commands as pocket-id
  community.general.sudoers:
    name: pocket-id-runas
    user: "{{ admin_user }}"
    runas: pocket-id
    commands: ALL
    nopassword: true

- name: Enable lingering for pocket-id (keeps its systemd --user instance running without a login session)
  ansible.builtin.command: loginctl enable-linger pocket-id
  args:
    creates: /var/lib/systemd/linger/pocket-id

- name: Ensure pocket-id's systemd --user instance is running
  ansible.builtin.systemd_service:
    name: "user@{{ pocket_id_user.uid }}.service"
    state: started

- name: Create pocket-id data directory
  ansible.builtin.file:
    path: /var/lib/pocket-id/data
    state: directory
    owner: pocket-id
    group: pocket-id
    mode: "0700"

- name: Configure pocket-id environment
  ansible.builtin.template:
    src: pocket-id.env.j2
    dest: /var/lib/pocket-id/pocket-id.env
    owner: pocket-id
    group: pocket-id
    mode: "0600"
  notify: restart pocket-id

- name: Create administrator-managed Quadlet directory for pocket-id's user
  ansible.builtin.file:
    path: "/etc/containers/systemd/users/{{ pocket_id_user.uid }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install pocket-id Quadlet unit
  ansible.builtin.template:
    src: pocket-id.container.j2
    dest: "/etc/containers/systemd/users/{{ pocket_id_user.uid }}/pocket-id.container"
    owner: root
    group: root
    mode: "0644"
  notify: restart pocket-id

- name: Enable podman auto-update timer for pocket-id
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: pocket-id
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pocket_id_user.uid }}"

- name: Ensure pocket-id service is enabled and started
  ansible.builtin.systemd_service:
    name: pocket-id.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: pocket-id
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pocket_id_user.uid }}"

# Normally created by the backup role; kept here too so a standalone
# `--tags pocket_id` run on a fresh host does not fail.
- name: Ensure backup drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/backup/paths.d
    - /etc/backup/pre.d

# root-owned: the pre-backup hook runs as root, and this keeps the dump
# unreadable to the service user.
- name: Create pocket-id database dump directory
  ansible.builtin.file:
    path: /var/lib/pocket-id/backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install pocket-id pre-backup hook
  ansible.builtin.copy:
    src: backup-pre.sh
    dest: /etc/backup/pre.d/50-pocket-id.sh
    owner: root
    group: root
    mode: "0755"

# Deliberately not /var/lib/pocket-id wholesale -- that would drag in the
# podman image storage under .local/share/containers. The live SQLite files
# in data/ are crash-consistent at worst; the authoritative restore artifact
# is the dump in backup/. pocket-id.env is regenerable from the inventory.
- name: Register pocket-id backup paths
  ansible.builtin.copy:
    content: |
      /var/lib/pocket-id/data
      /var/lib/pocket-id/backup
    dest: /etc/backup/paths.d/50-pocket-id.txt
    owner: root
    group: root
    mode: "0644"

# --- Cloudflare tunnel ---
# The tunnel itself (and its DNS CNAME) is created once in the dashboard;
# its token and ID go into the vaulted inventory. Everything else -- the
# connector service and the ingress configuration -- is managed here.

- name: Ensure Cloudflare tunnel credentials are configured
  ansible.builtin.assert:
    that:
      - cloudflare_account_id is defined
      - cloudflare_api_token is defined
      - pocket_id_tunnel_id is defined
      - pocket_id_tunnel_token is defined
    fail_msg: >-
      Missing Cloudflare tunnel variables for {{ inventory_hostname }}. Create
      the tunnel in the Cloudflare dashboard and add cloudflare_account_id,
      cloudflare_api_token, pocket_id_tunnel_id and pocket_id_tunnel_token to
      the vaulted inventory.

- name: Create cloudflared config directory
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure cloudflared environment
  ansible.builtin.template:
    src: cloudflared.env.j2
    dest: /etc/cloudflared/env
    owner: root
    group: root
    mode: "0600"
  notify: restart cloudflared

- name: Install cloudflared systemd unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd daemon-reload
    - restart cloudflared

# `cloudflared service install` also set up self-update units; the package
# is updated through apt, so they are redundant.
- name: Check for cloudflared self-update timer
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared-update.timer
  register: pocket_id_cf_update_timer

- name: Disable cloudflared self-update timer
  ansible.builtin.systemd_service:
    name: cloudflared-update.timer
    enabled: false
    state: stopped
  when: pocket_id_cf_update_timer.stat.exists

- name: Remove cloudflared self-update units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/cloudflared-update.timer
    - /etc/systemd/system/cloudflared-update.service
  notify: systemd daemon-reload

- name: Ensure cloudflared service is enabled and started
  ansible.builtin.systemd_service:
    name: cloudflared.service
    daemon_reload: true
    enabled: true
    state: started

- name: Fetch current tunnel configuration
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ pocket_id_tunnel_id }}/configurations"
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
  register: pocket_id_tunnel_config
  delegate_to: localhost
  become: false

# The API returns ingress entries with extra fields (e.g. originRequest),
# so compare only the hostname/service projection.
- name: Configure tunnel ingress
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ pocket_id_tunnel_id }}/configurations"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    body_format: json
    body:
      config:
        ingress: "{{ pocket_id_tunnel_ingress }}"
  vars:
    pocket_id_tunnel_ingress_current: "{{ (pocket_id_tunnel_config.json.result.config | default({}, true)).ingress | default([], true) }}"
  when: >-
    pocket_id_tunnel_ingress_current | map(attribute='hostname', default='') | list
      != pocket_id_tunnel_ingress | map(attribute='hostname', default='') | list
    or pocket_id_tunnel_ingress_current | map(attribute='service') | list
      != pocket_id_tunnel_ingress | map(attribute='service') | list
  changed_when: true
  delegate_to: localhost
  become: false

# The dashboard's "public hostname" flow creates this record implicitly;
# via the API it is a separate concern, so manage it explicitly.
- name: Configure tunnel DNS record
  community.general.cloudflare_dns:
    zone: "{{ pocket_id_tunnel_zone }}"
    record: "{{ pocket_id_app_url | urlsplit('hostname') }}"
    type: CNAME
    value: "{{ pocket_id_tunnel_id }}.cfargotunnel.com"
    proxied: true
    ttl: 1
    solo: true
    api_token: "{{ cloudflare_api_token }}"
    state: present
  delegate_to: localhost
  become: false
