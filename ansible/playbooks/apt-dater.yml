---
# Generates a local apt-dater hosts.xml from the inventory, so apt-dater on
# this machine can reach every managed host without maintaining a second,
# separate list of hosts/ports/users.
- hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Write apt-dater hosts.xml
      ansible.builtin.copy:
        dest: "../../hosts.xml"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE hosts SYSTEM "file://{{ hosts_dtd_path }}/hosts.dtd">
          <hosts xmlns:xi="http://www.w3.org/2001/XInclude">
            <group name="mhnet">
          {% for host in groups['all'] %}
              <host name="{{ host }}" ssh-host="{{ hostvars[host].ansible_host | default(host) }}" ssh-port="{{ hostvars[host].ansible_port | default(22) }}" ssh-user="{{ hostvars[host].ansible_user | default('root') }}"/>
          {% endfor %}
            </group>
          </hosts>
        mode: "0600"
      vars:
        hosts_dtd_path: "{{ lookup('ansible.builtin.env', 'APT_DATER_DTD_ROOT', default=undef()) }}"
