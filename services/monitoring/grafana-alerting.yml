# Provisioned by services/monitoring.nix.
# Alert rules and notification templates only; contact points and
# notification policies stay UI-managed, these rules route through the
# default policy.
apiVersion: 1

templates:
  - orgId: 1
    name: mhnet
    template: |
      {{/* Grafana Explore link to the unit's journal in VictoriaLogs (the
           instance label matches journald's _HOSTNAME). Per-alert data has
           no ExternalURL, so the base URL is recovered from SilenceURL. */}}
      {{ define "mhnet.unitLogsURL" -}}
      {{ reReplaceAll "/alerting/silence/new.*" "" .SilenceURL }}/explore?left={{ urlquery `{"datasource":"victorialogs","queries":[{"refId":"A","expr":"_HOSTNAME:\"` .Labels.instance `\" AND _SYSTEMD_UNIT:\"` .Labels.unit `\""}],"range":{"from":"now-24h","to":"now"}}` }}
      {{- end }}

  # ntfy's JSON publish format, for a Webhook contact point (UI-managed):
  # URL = https://ntfy.sh (the root: JSON publishing names the topic in the
  # body), Custom Payload = {{ template "ntfy.payload" . }}, and a payload
  # variable `topic` holding the topic from secrets/ntfy-url.age, which
  # thereby stays out of the repo. A single alert gets its links as action
  # buttons (ntfy allows three); a group links to the alert list instead.
  - orgId: 1
    name: ntfy
    template: |
      {{ define "ntfy.title" -}}
      {{ with .CommonLabels.alertname }}{{ . }}: {{ end -}}
      {{ with .Alerts.Firing }}{{ len . }} firing{{ end -}}
      {{ if and .Alerts.Firing .Alerts.Resolved }}, {{ end -}}
      {{ with .Alerts.Resolved }}{{ len . }} resolved{{ end -}}
      {{ end }}

      {{ define "ntfy.message" -}}
      {{ range $i, $a := .Alerts -}}
      {{ if $i }}{{ "\n\n" }}{{ end -}}
      {{ if eq $a.Status "firing" }}🔴{{ else }}✅{{ end }} {{ $a.Labels.alertname }}{{ with $a.Labels.instance }} · {{ . }}{{ end }}
      {{- with $a.Annotations.summary }}{{ "\n" }}{{ . }}{{ end }}
      {{- end }}
      {{- end }}

      {{ define "ntfy.payload" -}}
      {{- $firing := gt (len .Alerts.Firing) 0 -}}
      {{- $priority := 2 -}}
      {{- if $firing }}{{ $priority = 4 }}{{ end -}}
      {{- $click := printf "%s/alerting/list" (reReplaceAll "/+$" "" .ExternalURL) -}}
      {{- $actions := coll.Slice -}}
      {{- if eq (len .Alerts) 1 -}}
        {{- $a := index .Alerts 0 -}}
        {{- $click = $a.GeneratorURL -}}
        {{- if eq $a.Status "firing" -}}
          {{- $actions = coll.Append (coll.Dict "action" "view" "label" "Silence" "url" $a.SilenceURL) $actions -}}
        {{- end -}}
        {{- if $a.Labels.unit -}}
          {{- $actions = coll.Append (coll.Dict "action" "view" "label" "Logs" "url" (tmpl.Exec "mhnet.unitLogsURL" $a)) $actions -}}
        {{- end -}}
      {{- end -}}
      {{ coll.Dict "topic" .Vars.topic "title" (tmpl.Exec "ntfy.title" .) "message" (tmpl.Exec "ntfy.message" .) "priority" $priority "click" $click "actions" $actions | data.ToJSON }}
      {{- end }}

  # Compact Telegram-friendly rendering; the default template dumps values,
  # every label, and bare URLs. To use it, point the Telegram contact point
  # (UI-managed) at it: Message = {{ template "telegram.message" . }} and
  # Parse mode = HTML. Label/annotation values must not contain raw HTML
  # metacharacters (&, <, >) -- ours are hostnames, unit names, paths.
  - orgId: 1
    name: telegram
    template: |
      {{ define "telegram.alert" -}}
      <b>{{ .Labels.alertname }}</b>{{ with .Labels.instance }} · <code>{{ . }}</code>{{ end }}
      {{ with .Annotations.summary }}{{ . }}
      {{ end -}}
      {{ with .Annotations.description }}{{ . }}
      {{ end -}}
      <a href="{{ .GeneratorURL }}">source</a>{{ if eq .Status "firing" }} · <a href="{{ .SilenceURL }}">silence</a>{{ end }}{{ with .Labels.unit }} · <a href="{{ template "mhnet.unitLogsURL" $ }}">logs</a>{{ end }}
      {{ end }}

      {{ define "telegram.message" -}}
      {{ if .Alerts.Firing -}}
      🔴 <b>{{ len .Alerts.Firing }} firing</b>
      {{ range .Alerts.Firing }}
      {{ template "telegram.alert" . -}}
      {{ end }}
      {{ end -}}
      {{ if .Alerts.Resolved -}}
      ✅ <b>{{ len .Alerts.Resolved }} resolved</b>
      {{ range .Alerts.Resolved }}
      {{ template "telegram.alert" . -}}
      {{ end }}
      {{ end -}}
      {{ end }}

groups:
  - orgId: 1
    name: mhnet
    folder: mhnet
    interval: 5m
    rules:
      # One alert instance per failed unit, so notifications name each unit
      # and the templates can link its journal. Healthy hosts export
      # no systemd_failed_unit series at all, hence noDataState OK; a dead
      # agent is still caught by StaleTextfileMetrics going NoData.
      # rhea is left out: its units push to ntfy directly (mhnet.notify), with
      # journal lines and without depending on Grafana being up.
      - uid: mhnet-failed-units
        title: FailedUnits
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            Unit {{ $labels.unit }} on {{ $labels.instance }} is in the
            failed state (logs in VictoriaLogs:
            _HOSTNAME:{{ $labels.instance }} AND
            _SYSTEMD_UNIT:{{ $labels.unit }}).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: sum by (instance, unit) (systemd_failed_unit{instance!="rhea"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: mhnet-conffile-leftovers
        title: ConffileLeftovers
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: >-
            {{ $labels.instance }} has dpkg conffile leftovers under /etc;
            diff each *.dpkg-dist/-new/-old/*.ucf-dist against the kept file
            and delete it once reconciled (see docs/monitoring.md).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: sum by (instance) (dpkg_conffile_leftovers)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # Textfile metrics keep reporting their last value if their timer
      # breaks; the dpkg timer is the slowest at daily, so anything older
      # than 25h means the metric can no longer be trusted.
      - uid: mhnet-stale-textfile
        title: StaleTextfileMetrics
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: >-
            Textfile metric {{ $labels.file }} on {{ $labels.instance }} has
            not been refreshed for over 25h; its exporting timer is likely
            broken and the metric value is stale.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: time() - node_textfile_mtime_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90000] }
