---
# SilverBullet: one systemd instance (silverbullet@<name>) per space, each
# with its own space folder, credentials and public hostname, all served by
# the same pinned binary. Instances listen on unix sockets that cloudflared
# connects to; nothing binds a public port.
#
# Auth is SilverBullet's own single-user login (SB_USER) -- it speaks no OIDC,
# so pocket-id is not in the picture here.

- name: Ensure SilverBullet instances are configured
  ansible.builtin.assert:
    that:
      - silverbullet_instances | length > 0
      - silverbullet_instances | map(attribute='name', default='') | select('match', '^[a-z0-9][a-z0-9-]*$') | list | length == silverbullet_instances | length
      - silverbullet_instances | map(attribute='name', default='') | unique | length == silverbullet_instances | length
      - silverbullet_instances | selectattr('hostname', 'defined') | list | length == silverbullet_instances | length
      - silverbullet_instances | selectattr('user', 'defined') | list | length == silverbullet_instances | length
    fail_msg: >-
      Missing or malformed silverbullet_instances for {{ inventory_hostname }}.
      Every entry needs a unique name ([a-z0-9-], used for the unit and the
      space folder), a hostname and user credentials in "user:password" form;
      add them to the vaulted inventory (see README).

# Metrics ports are positional by default, so resolve them once: the env
# files and vmagent's scrape targets have to agree on them.
- name: Resolve the SilverBullet instance metrics ports
  ansible.builtin.set_fact:
    silverbullet_resolved: >-
      {{ silverbullet_resolved | default([]) + [item | combine({'metrics_port': sb_port})] }}
    silverbullet_scrape_targets: >-
      {{ silverbullet_scrape_targets | default([])
         + [{'targets': ['127.0.0.1:' ~ sb_port],
             'labels': {'instance': inventory_hostname, 'space': item.name}}] }}
  vars:
    sb_port: "{{ item.metrics_port | default(silverbullet_metrics_base_port + sb_index) }}"
  loop: "{{ silverbullet_instances }}"
  loop_control:
    index_var: sb_index
    label: "{{ item.name }}"

# --- binary ---

- name: Install unarchive dependencies
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true

- name: Create SilverBullet install directory
  ansible.builtin.file:
    path: "{{ silverbullet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Download SilverBullet {{ silverbullet_version }}"
  ansible.builtin.unarchive:
    src: "https://github.com/silverbulletmd/silverbullet/releases/download/{{ silverbullet_version }}/silverbullet-server-linux-{{ silverbullet_arch }}.zip"
    remote_src: true
    dest: "{{ silverbullet_dir }}"
    creates: "{{ silverbullet_dir }}/silverbullet"
    owner: root
    group: root
    mode: "0755"

- name: Link the SilverBullet binary
  ansible.builtin.file:
    src: "{{ silverbullet_dir }}/silverbullet"
    dest: /usr/local/bin/silverbullet
    state: link
  notify: restart silverbullet

- name: Find superseded SilverBullet versions
  ansible.builtin.find:
    paths: /usr/local/lib/silverbullet
    file_type: directory
    excludes: "{{ silverbullet_version }}"
  register: silverbullet_old

- name: Remove superseded SilverBullet versions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ silverbullet_old.files }}"
  loop_control:
    label: "{{ item.path }}"

# --- instances ---

- name: Create silverbullet system group
  ansible.builtin.group:
    name: silverbullet
    system: true

- name: Create silverbullet system user
  ansible.builtin.user:
    name: silverbullet
    group: silverbullet
    system: true
    home: /var/lib/silverbullet
    create_home: false
    shell: /usr/sbin/nologin

# The per-instance folders below it are created by the unit's StateDirectory.
- name: Create the SilverBullet spaces directory
  ansible.builtin.file:
    path: /var/lib/silverbullet
    state: directory
    owner: silverbullet
    group: silverbullet
    mode: "0750"

- name: Create SilverBullet configuration directory
  ansible.builtin.file:
    path: /etc/silverbullet
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the SilverBullet instances
  ansible.builtin.template:
    src: instance.env.j2
    dest: "/etc/silverbullet/{{ item.name }}.env"
    owner: root
    group: silverbullet
    mode: "0640"
  loop: "{{ silverbullet_resolved }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart silverbullet

- name: Install the SilverBullet systemd template unit
  ansible.builtin.template:
    src: silverbullet@.service.j2
    dest: /etc/systemd/system/silverbullet@.service
    owner: root
    group: root
    mode: "0644"
  notify: restart silverbullet

- name: Ensure the SilverBullet instances are enabled and started
  ansible.builtin.systemd_service:
    name: "silverbullet@{{ item.name }}.service"
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ silverbullet_instances }}"
  loop_control:
    label: "{{ item.name }}"

# Env files hold the credentials, so a stale one keeps working: remove the
# units of instances that were dropped from the inventory.
- name: Find configured SilverBullet instances
  ansible.builtin.find:
    paths: /etc/silverbullet
    patterns: "*.env"
  register: silverbullet_configured

- name: Remove instances that are no longer in the inventory
  ansible.builtin.include_tasks: remove_instance.yml
  loop: "{{ silverbullet_configured.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.env$', '') | difference(silverbullet_instances | map(attribute='name') | list) }}"
  loop_control:
    loop_var: silverbullet_removed

# --- backups ---
# The space is plain Markdown files, so there is nothing to dump first; the
# folder itself is the restore artifact.

- name: Ensure backup drop-in directories exist
  ansible.builtin.include_role:
    name: backup
    tasks_from: dropin_dirs

- name: Register SilverBullet backup paths
  ansible.builtin.copy:
    content: |
      /var/lib/silverbullet
    dest: /etc/backup/paths.d/50-silverbullet.txt
    owner: root
    group: root
    mode: "0644"

# --- monitoring ---

- name: Scrape the SilverBullet metrics endpoints
  ansible.builtin.include_role:
    name: monitoring_agent
    tasks_from: scrape_config
  vars:
    monitoring_agent_scrape_name: silverbullet
    monitoring_agent_scrape_config:
      - job_name: silverbullet
        static_configs: "{{ silverbullet_scrape_targets }}"

# --- Cloudflare tunnel ---

- name: Install the Cloudflare tunnel connector
  ansible.builtin.include_role:
    name: cloudflared

- name: Expose the SilverBullet instances through the Cloudflare tunnel
  ansible.builtin.include_role:
    name: cloudflared
    tasks_from: expose
  vars:
    cloudflared_expose_hostname: "{{ item.hostname }}"
    cloudflared_expose_service: "unix:/run/silverbullet/{{ item.name }}/silverbullet.sock"
  loop: "{{ silverbullet_instances }}"
  loop_control:
    label: "{{ item.hostname }}"
