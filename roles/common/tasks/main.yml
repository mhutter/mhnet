---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: bootstrap

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ inventory_hostname }}"
    owner: root
    group: root
    mode: "0644"
  tags: bootstrap

- name: Configure user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ admin_uid }}"
    shell: /bin/bash
  tags: bootstrap

# runas ALL matters: without it the rule only permits running as root, and
# Ansible's become_user for service accounts (e.g. postgres) fails.
- name: Allow sudo
  community.general.sudoers:
    name: admin-allow-all
    user: "{{ admin_user }}"
    runas: ALL
    commands: ALL
    nopassword: true
  tags: bootstrap

- name: Set SSH public keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
  tags: bootstrap

- name: Remove default users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop:
    - ubuntu
    - ec2-user

# This must be the LAST "bootstrap" task, because it reconfigures and restarts
# the SSH server.
- name: Configure SSH server
  ansible.builtin.template:
    src: sshd_config
    dest: /etc/ssh/sshd_config.d/00-mhnet.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - restart ssh.service
    - restart ssh.socket
  tags: bootstrap

- name: Disable apt recommends and suggests
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
    owner: root
    group: root
    mode: "0644"

- name: Remove unused packages
  ansible.builtin.apt:
    name:
      - man-db
      - manpages
      - snapd
    state: absent
    autoremove: true
    purge: true

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-dater-host
      - unattended-upgrades
    state: present
    update_cache: true

# Pinned so the unattended-upgrades reboot window below is unambiguous
# year-round, independent of DST.
- name: Set timezone to UTC
  ansible.builtin.timezone:
    name: Etc/UTC

- name: Enable periodic apt updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 51-mhnet-unattended-upgrades
    dest: /etc/apt/apt.conf.d/51-mhnet-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
