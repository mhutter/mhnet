---
- name: Configure user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ admin_uid }}"
    shell: /bin/bash
  tags: bootstrap

- name: Allow sudo
  community.general.sudoers:
    name: admin-allow-all
    user: "{{ admin_user }}"
    commands: ALL
    nopassword: true
  tags: bootstrap

- name: Set SSH public keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
  tags: bootstrap

- name: Remove default users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop:
    - ubuntu
    - ec2-user

# This must be the LAST "bootstrap" task, because it reconfigures and restarts
# the SSH server.
- name: Configure SSH server
  ansible.builtin.template:
    src: sshd_config
    dest: /etc/ssh/sshd_config.d/00-mhnet.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - restart ssh.service
    - restart ssh.socket
  tags: bootstrap

- name: Disable apt recommends and suggests
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
    owner: root
    group: root
    mode: "0644"

- name: Remove unused packages
  ansible.builtin.apt:
    name:
      - manpages
      - man-db
    state: absent
    autoremove: true
    purge: true

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-dater-host
    state: present
    update_cache: true
