---
# Required from the inventory (no usable defaults):
# monitoring_ingest_hostname -- public DNS name of the hub's ingest endpoints
#   (unused once monitoring_metrics_url and monitoring_logs_url are set)
# monitoring_remote_write_password -- basic auth password for the metrics API

# Shared with monitoring_hub; keep the two roles' defaults in sync.
monitoring_remote_write_user: monitoring
monitoring_metrics_port: 8428
monitoring_logs_port: 9428

# Base URLs (no path) of the metrics and logs APIs. The defaults are the
# Ansible hub's ports; override both in the inventory to push to hosts that
# serve them behind a reverse proxy on 443 instead, e.g. rhea.
monitoring_metrics_url: "https://{{ monitoring_ingest_hostname }}:{{ monitoring_metrics_port }}"
monitoring_logs_url: "https://{{ monitoring_ingest_hostname }}:{{ monitoring_logs_port }}"
monitoring_scrape_interval: 30s

# Whether this host runs the hub's VictoriaMetrics server (and so must not
# have it masked).
monitoring_agent_is_hub: "{{ 'monitoring' in group_names }}"

# Cap for vmagent's on-disk buffer while the hub is unreachable.
monitoring_agent_max_buffer: 512MiB

# Cap for the local journal; logs live on the hub now, locally the journal
# only needs to buffer hub outages (journal-upload resumes from its cursor).
monitoring_agent_journal_max_use: 500M

# node_exporter runs with --collector.disable-defaults; only collectors
# answering a question we actually care about on a small VPS are enabled:
# disk space (filesystem), memory/OOM (meminfo, vmstat), CPU usage and
# saturation (cpu, pressure, loadavg), reboots (stat), clock sync (timex),
# I/O and traffic rates (diskstats, netdev), fleet versions (uname, os) and
# the custom textfile metrics. Failed systemd units come from a textfile
# timer, not the (expensive) systemd collector.
monitoring_agent_enabled_collectors:
  - cpu
  - diskstats
  - filesystem
  - loadavg
  - meminfo
  - netdev
  - os
  - pressure
  - stat
  - textfile
  - timex
  - uname
  - vmstat

# Extra entries for vmagent's scrape_configs, e.g. an app's metrics endpoint:
#   monitoring_agent_extra_scrape_configs:
#     - job_name: miniflux
#       static_configs:
#         - targets: ["127.0.0.1:8080"]
#           labels: { instance: "{{ inventory_hostname }}" }
monitoring_agent_extra_scrape_configs: []
