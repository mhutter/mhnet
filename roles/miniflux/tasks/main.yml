---
# Also installs dbconfig-no-thanks, which must be present before miniflux so
# the debconf database wizard never runs.
- name: Install PostgreSQL
  ansible.builtin.include_role:
    name: postgresql

- name: Install miniflux
  ansible.builtin.apt:
    name: miniflux
    state: present

- name: Create miniflux database
  ansible.builtin.include_role:
    name: postgresql
    tasks_from: database
  vars:
    postgresql_database_name: "{{ miniflux_db_name }}"
    postgresql_database_owner: "{{ miniflux_db_user }}"

# The package's postinst chmods the config back to world-readable 0644 on
# every upgrade unless a statoverride on /etc/miniflux is registered -- and
# the config holds the OAuth2 client secret.
- name: Keep package upgrades from resetting /etc/miniflux permissions
  ansible.builtin.command: dpkg-statoverride --update --add root miniflux 750 /etc/miniflux
  register: miniflux_statoverride
  changed_when: miniflux_statoverride.rc == 0
  failed_when:
    - miniflux_statoverride.rc != 0
    - "'already exists' not in miniflux_statoverride.stderr"

- name: Configure miniflux
  ansible.builtin.template:
    src: miniflux.conf.j2
    dest: /etc/miniflux/miniflux.conf
    owner: root
    group: miniflux
    mode: "0640"
  notify: restart miniflux

- name: Ensure miniflux service is enabled and started
  ansible.builtin.systemd_service:
    name: miniflux.service
    enabled: true
    state: started

# Superseded by the postgresql role's all-databases hook; drop these tasks
# once scw-miniflux has converged.
- name: Remove legacy miniflux backup hook
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/backup/pre.d/50-miniflux.sh
    - /etc/backup/paths.d/50-miniflux.txt
    - /var/backups/miniflux

# --- Cloudflare tunnel ---

- name: Install the Cloudflare tunnel connector
  ansible.builtin.include_role:
    name: cloudflared

- name: Expose miniflux through the Cloudflare tunnel
  ansible.builtin.include_role:
    name: cloudflared
    tasks_from: expose
  vars:
    cloudflared_expose_hostname: "{{ miniflux_app_hostname }}"
    cloudflared_expose_service: "unix:{{ miniflux_listen_socket }}"
