---
firewall_allow_tcp_ports:
  - "{{ ssh_port }}"
firewall_allow_udp_ports: []

# TCP ports reachable only from specific source addresses, e.g. a service
# restricted to the rest of the fleet. Sources must be IPv6 literals (the
# fleet is IPv6-only; the template emits ip6 saddr):
#   firewall_allow_tcp_from:
#     - ports: [8080]
#       sources: ["2001:db8::1", "2001:db8::2"]
firewall_allow_tcp_from: []
