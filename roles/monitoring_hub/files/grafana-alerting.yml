# Managed by Ansible (roles/monitoring_hub).
# Alert rules only; contact points and notification policies stay UI-managed,
# these rules route through the default policy.
apiVersion: 1

# Compact Telegram-friendly notification rendering; the default template
# dumps values, every label, and bare URLs. To use it, point the Telegram
# contact point (UI-managed) at it: Message = {{ template "telegram.message" . }}
# and Parse mode = HTML. Label/annotation values must not contain raw
# HTML metacharacters (&, <, >) -- ours are hostnames, unit names, paths.
templates:
  - orgId: 1
    name: telegram
    template: |
      {{ define "telegram.alert" -}}
      <b>{{ .Labels.alertname }}</b>{{ with .Labels.instance }} · <code>{{ . }}</code>{{ end }}
      {{ with .Annotations.summary }}{{ . }}
      {{ end -}}
      {{ with .Annotations.description }}{{ . }}
      {{ end -}}
      <a href="{{ .GeneratorURL }}">source</a>{{ if eq .Status "firing" }} · <a href="{{ .SilenceURL }}">silence</a>{{ end }}
      {{ end }}

      {{ define "telegram.message" -}}
      {{ if .Alerts.Firing -}}
      🔴 <b>{{ len .Alerts.Firing }} firing</b>
      {{ range .Alerts.Firing }}
      {{ template "telegram.alert" . -}}
      {{ end }}
      {{ end -}}
      {{ if .Alerts.Resolved -}}
      ✅ <b>{{ len .Alerts.Resolved }} resolved</b>
      {{ range .Alerts.Resolved }}
      {{ template "telegram.alert" . -}}
      {{ end }}
      {{ end -}}
      {{ end }}

groups:
  - orgId: 1
    name: mhnet
    folder: mhnet
    interval: 5m
    rules:
      - uid: mhnet-failed-units
        title: FailedUnits
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: >-
            {{ $labels.instance }} has failed systemd units
            (systemd_failed_unit{instance="{{ $labels.instance }}"} lists
            them; the journal on this hub has the details).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: sum by (instance) (systemd_failed_units_total)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: mhnet-conffile-leftovers
        title: ConffileLeftovers
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: >-
            {{ $labels.instance }} has dpkg conffile leftovers under /etc;
            diff each *.dpkg-dist/-new/-old/*.ucf-dist against the kept file
            and delete it once reconciled (see README).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: sum by (instance) (dpkg_conffile_leftovers)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # Textfile metrics keep reporting their last value if their timer
      # breaks; the dpkg timer is the slowest at daily, so anything older
      # than 25h means the metric can no longer be trusted.
      - uid: mhnet-stale-textfile
        title: StaleTextfileMetrics
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: >-
            Textfile metric {{ $labels.file }} on {{ $labels.instance }} has
            not been refreshed for over 25h; its exporting timer is likely
            broken and the metric value is stale.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: time() - node_textfile_mtime_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90000] }
