---
# SilverBullet is not packaged in Debian; the role installs a pinned static
# binary from the GitHub releases -- bump silverbullet_version and re-run to
# update. Upstream's `silverbullet upgrade` self-updater is deliberately not
# used: it would overwrite the versioned install below.
silverbullet_version: "2.9.0"
silverbullet_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}[ansible_facts.architecture] }}"
silverbullet_dir: "/usr/local/lib/silverbullet/{{ silverbullet_version }}"

# One entry per space. Every instance is a separate systemd unit
# (silverbullet@<name>), space folder (/var/lib/silverbullet/<name>) and
# public hostname, all served by the one binary:
#
#   silverbullet_instances:
#     - name: notes                  # unit/folder id, [a-z0-9-]
#       hostname: notes.example.com  # public hostname on the tunnel
#       user: "me:<password>"        # SB_USER, single-user credentials
#       title: Notes                 # optional, SB_NAME (defaults to name)
#       index_page: Home             # optional, SB_INDEX_PAGE ("index")
#       read_only: false             # optional, SB_READ_ONLY
#       metrics_port: 3010           # optional, see below
silverbullet_instances: []

# Prometheus metrics: the Nth instance listens on 127.0.0.1:<base + N> unless
# it pins metrics_port itself. Reordering the list therefore reshuffles ports,
# which is harmless -- the units and the vmagent drop-in are rendered from the
# same resolved list in one run.
silverbullet_metrics_base_port: 3010

# Plugs may run shell commands as the silverbullet user unless a backend is
# configured; any value disables that.
silverbullet_shell_backend: "off"

# Exposure via Cloudflare tunnel is handled by the cloudflared role; see
# roles/cloudflared/defaults/main.yml for the required inventory variables.
