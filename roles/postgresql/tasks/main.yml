---
# dbconfig-no-thanks is installed alongside so packaged apps depending on
# `dbconfig-pgsql | dbconfig-no-thanks` (e.g. miniflux) never trigger the
# debconf database wizard -- databases are managed via tasks_from: database.
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2 # for the community.postgresql modules
      - dbconfig-no-thanks
    state: present
    update_cache: true

- name: Ensure PostgreSQL is enabled and started
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

# --- tuning ---

# Debian keeps one config tree per cluster; these hosts run the single
# packaged "main" cluster of whatever major version the release ships.
- name: Find the PostgreSQL cluster configuration
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    depth: 1
  register: postgresql_clusters

- name: Ensure exactly one PostgreSQL cluster was found
  ansible.builtin.assert:
    that:
      - postgresql_clusters.files | length == 1
    fail_msg: >-
      Expected a single cluster below /etc/postgresql on
      {{ inventory_hostname }}, found
      {{ postgresql_clusters.files | map(attribute="path") | list }}. A major
      version upgrade probably left the old cluster behind; drop it with
      pg_dropcluster once its data has been migrated.

- name: Note the cluster configuration directory
  ansible.builtin.set_fact:
    postgresql_conf_dir: "{{ postgresql_clusters.files[0].path }}/main"

# Debian has read conf.d since 9.4, so check rather than patch: the packaged
# postgresql.conf stays untouched, and a surprise here is worth looking at.
- name: Check that conf.d drop-ins are read
  ansible.builtin.command:
    cmd: >-
      grep -Eq "^[[:space:]]*include_dir[[:space:]]*=[[:space:]]*'conf[.]d'"
      {{ postgresql_conf_dir }}/postgresql.conf
  register: postgresql_include_dir
  changed_when: false
  failed_when: false

- name: Ensure conf.d drop-ins are read
  ansible.builtin.assert:
    that:
      - postgresql_include_dir.rc == 0
    fail_msg: >-
      {{ postgresql_conf_dir }}/postgresql.conf does not read conf.d, so the
      tuning drop-in would be ignored. Add `include_dir = 'conf.d'` to it by
      hand (Debian ships it enabled) and re-run.

- name: Tune PostgreSQL for this host
  ansible.builtin.template:
    src: tuning.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/10-tuning.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

# --- Backups ---

- name: Ensure backup drop-in directories exist
  ansible.builtin.include_role:
    name: backup
    tasks_from: dropin_dirs

# root-owned: the pre-backup hook runs as root, and this keeps the dumps
# unreadable to service users.
- name: Create PostgreSQL dump directory
  ansible.builtin.file:
    path: /var/backups/postgresql
    state: directory
    owner: root
    group: root
    mode: "0700"

# Dumps every database, so app roles need no backup hooks of their own.
- name: Install PostgreSQL pre-backup hook
  ansible.builtin.copy:
    src: backup-pre.sh
    dest: /etc/backup/pre.d/50-postgresql.sh
    owner: root
    group: root
    mode: "0755"

# The dumps are the authoritative restore artifact; PGDATA is deliberately
# not backed up raw.
- name: Register PostgreSQL backup paths
  ansible.builtin.copy:
    content: |
      /var/backups/postgresql
    dest: /etc/backup/paths.d/50-postgresql.txt
    owner: root
    group: root
    mode: "0644"
